name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "state/**"
      - "working.txt"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Plan against the real source file (no Telegram calls)
        env:
          V2TG_CHANNELS: '[{"username":"@ci_one","daily_quota":100},{"username":"@ci_two","daily_quota":100},{"username":"@ci_three","daily_quota":100}]'
          V2TG_RUNTIME__DRY_RUN: "true"
        run: |
          python main.py plan
          python main.py preview | head -40
