name: Send configs

# Cron drives everything. Each run sends only the batches whose scheduled time
# has arrived, then commits state/ back so the next run knows what happened.
# GitHub caps a single job at 6 hours, so a 24-hour schedule cannot be one long
# sleeping run — short frequent runs plus persisted state is what makes it work.
on:
  schedule:
    # Every 15 minutes. GitHub's scheduler is best-effort and can be several
    # minutes late; schedule.grace_minutes in config.json absorbs that drift.
    - cron: "*/15 * * * *"

  workflow_dispatch:
    inputs:
      command:
        description: "What to do"
        type: choice
        default: run
        options: [run, plan, status, preview]
      rebuild:
        description: "Discard the current queue and re-plan from working.txt"
        type: boolean
        default: false
      dry_run:
        description: "Do everything except actually post to Telegram"
        type: boolean
        default: false
      batch_size:
        description: "Configs per message (blank = use config.json)"
        type: string
        default: ""
      window_hours:
        description: "Hours to spread the quota over (blank = use config.json)"
        type: string
        default: ""
      log_level:
        description: "Log verbosity"
        type: choice
        default: INFO
        options: [INFO, DEBUG, WARNING]

# One run at a time. Two concurrent runs would both read the same queue and
# double-post. Queued runs are not cancelled — the cron will catch up anyway.
concurrency:
  group: send-configs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A shallow clone is enough and keeps the commit-back fast.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check that secrets are configured
        id: guard
        env:
          HAS_ID: ${{ secrets.TELEGRAM_API_ID != '' }}
          HAS_HASH: ${{ secrets.TELEGRAM_API_HASH != '' }}
          HAS_SESSION: ${{ secrets.TELEGRAM_SESSION != '' }}
        run: |
          if [ "$HAS_ID" = "true" ] && [ "$HAS_HASH" = "true" ] && [ "$HAS_SESSION" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏸️ Waiting for secrets"
              echo
              echo "Set these under **Settings → Secrets and variables → Actions**:"
              echo
              echo "| Secret | Present |"
              echo "|---|---|"
              echo "| \`TELEGRAM_API_ID\` | $HAS_ID |"
              echo "| \`TELEGRAM_API_HASH\` | $HAS_HASH |"
              echo "| \`TELEGRAM_SESSION\` | $HAS_SESSION |"
              echo
              echo "See section 5 of the README. Nothing was sent."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Telegram secrets are not set yet — skipping the send step."
          fi

      - name: Sanity-check configuration
        run: python main.py status
        env:
          V2TG_RUNTIME__DRY_RUN: "true"

      - name: Send due batches
        id: send
        if: steps.guard.outputs.ready == 'true'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          # Optional secret: overrides the channel list in config.json.
          V2TG_CHANNELS: ${{ secrets.CHANNELS }}
          # workflow_dispatch overrides. Blank values are ignored by settings.py.
          V2TG_SCHEDULE__BATCH_SIZE: ${{ inputs.batch_size }}
          V2TG_SCHEDULE__WINDOW_HOURS: ${{ inputs.window_hours }}
          V2TG_RUNTIME__DRY_RUN: ${{ inputs.dry_run && 'true' || '' }}
          LOG_LEVEL: ${{ inputs.log_level || 'INFO' }}
        run: |
          python main.py "${{ inputs.command || 'run' }}" \
            ${{ inputs.rebuild && '--rebuild' || '' }}

      - name: Commit state
        if: always() && steps.send.outcome == 'success' && inputs.dry_run != true
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain state/)" ]; then
            echo "state/ unchanged — nothing to commit"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git commit -m "chore(state): record sent batches [skip ci]"

          # Another run may have pushed while this one was sending. Retry with a
          # rebase; state/ files are rewritten wholesale so a conflict is
          # resolved by keeping our newer version.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — rebasing onto origin (attempt $attempt)"
            git pull --rebase --strategy-option=theirs origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 5))
          done

          echo "::error::could not push state after 3 attempts"
          exit 1

      - name: Upload state as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: state-${{ github.run_number }}
          path: state/
          retention-days: 7
          if-no-files-found: ignore
